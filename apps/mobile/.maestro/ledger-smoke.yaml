appId: com.davidadokuru.kobo
name: Ledger correction and recurring management smoke test
tags:
  - local
  - ios
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible: ".*(Not Now|Start planning|Welcome back).*"
    timeout: 60000

- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

- extendedWaitUntil:
    visible: ".*(Start planning|Welcome back).*"
    timeout: 60000

- runFlow:
    when:
      visible: "Start planning"
    commands:
      - tapOn: "Start planning"
- runFlow:
    when:
      visible: "Don't have an account? Create one"
    commands:
      - tapOn: "Don't have an account? Create one"
- extendedWaitUntil:
    visible: "Create your account."
    timeout: 60000
- tapOn:
    id: "field-name"
- inputText: "Kobo Smoke"
- tapOn:
    id: "field-email"
- inputText: "${E2E_EMAIL}"
- tapOn: "Show password"
- tapOn:
    id: "field-password"
- inputText: "${E2E_PASSWORD}"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*(AVAILABLE THIS MONTH|LEFT TO SPEND).*"
    timeout: 60000

# Add an expense.
- tapOn: "Add entry"
- tapOn: "Enter 5"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn: "Choose category"
- tapOn: "Select Food category"
- tapOn:
    id: "entry-note"
- inputText: "Smoke original"
- pressKey: Enter
- tapOn: "Save entry"
- assertVisible: "Edit Smoke original"

# Open this month's full history and correct the entry.
- repeat:
    times: 3
    commands:
      - swipe:
          direction: UP
          duration: 500
- tapOn: "View all transactions"
- assertVisible: "Transactions"
- assertVisible: "Edit Smoke original"
- tapOn: "Edit Smoke original"
- tapOn:
    text: "Delete amount digit"
    repeat: 4
- tapOn: "Enter 7"
- tapOn: "Enter 5"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn:
    id: "entry-note"
- eraseText
- inputText: "Smoke corrected"
- pressKey: Enter
- tapOn: "Choose category"
- tapOn: "Select Transport category"
- tapOn: "Entry date"
- evalScript: >-
    ${var d = new Date(Date.now() - 86400000);
      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      output.yesterday = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];}
- tapOn: "${output.yesterday}"
- tapOn:
    point: "5%,50%"
- tapOn: "Save entry changes"
- assertVisible: "Edit Smoke corrected"

# Relaunch proves the correction was persisted, then remove it from both views.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Edit Smoke corrected"
    timeout: 15000
- repeat:
    times: 3
    commands:
      - swipe:
          direction: UP
          duration: 500
- tapOn: "View all transactions"
- tapOn: "Edit Smoke corrected"
- scrollUntilVisible:
    element:
      text: "Delete entry"
    direction: DOWN
- tapOn: "Delete entry"
- tapOn: "Yes, delete entry"
- assertNotVisible: "Edit Smoke corrected"
- tapOn:
    id: "BackButton"
- assertNotVisible: "Edit Smoke corrected"

# Create, edit, pause, resume, and delete a recurring rule.
- tapOn: "Recurring"
- extendedWaitUntil:
    visible: "Monthly bills"
    timeout: 15000
- tapOn: "Add one"
- tapOn: "Select Food category"
- scrollUntilVisible:
    element:
      text: "Enter 0"
    direction: DOWN
- tapOn: "Enter 1"
- tapOn: "Enter 5"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn: "Save recurring item"
- assertVisible: "Edit recurring item Food"
- tapOn: "Edit recurring item Food"
- tapOn:
    id: "recurrence-frequency-picker"
- tapOn: "Weekly"
- tapOn:
    id: "weekday-picker"
- tapOn: "Monday"
- tapOn: "Select Bills & PHCN category"
- scrollUntilVisible:
    element:
      text: "Delete amount digit"
    direction: DOWN
- tapOn:
    text: "Delete amount digit"
    repeat: 4
- tapOn: "Enter 2"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn: "Enter 0"
- tapOn: "Save recurring item"
- assertVisible: "Edit recurring item Bills & PHCN"

- tapOn: "Edit recurring item Bills & PHCN"
- scrollUntilVisible:
    element:
      text: "Pause recurring item"
    direction: DOWN
- tapOn: "Pause recurring item"
- assertVisible: "Edit recurring item Bills & PHCN, Paused"
- tapOn: "Edit recurring item Bills & PHCN, Paused"
- scrollUntilVisible:
    element:
      text: "Resume recurring item"
    direction: DOWN
- tapOn: "Resume recurring item"
- tapOn: "Edit recurring item Bills & PHCN"
- scrollUntilVisible:
    element:
      text: "Delete recurring item"
    direction: DOWN
- tapOn: "Delete recurring item"
- tapOn: "Yes, delete item"
- assertNotVisible: "Bills & PHCN"

# Income due today stays pending until it is received, then enters this month's ledger.
- tapOn: "Add one"
- tapOn: "Income"
- evalScript: >-
    ${var day = new Date().getDate(); var rem100 = day % 100; output.todayDay = day + (rem100 >= 11 && rem100 <= 13 ? 'th' : day % 10 === 1 ? 'st' : day % 10 === 2 ? 'nd' : day % 10 === 3 ? 'rd' : 'th');}
- tapOn:
    id: "day-of-month-picker"
- tapOn: "${output.todayDay}"
- tapOn: "Select Salary category"
- scrollUntilVisible:
    element:
      text: "Enter 0"
    direction: DOWN
- tapOn: "Enter 3"
- tapOn:
    text: "Enter 0"
    repeat: 3
- tapOn: "Save recurring item"
- assertVisible: "Needs confirmation"

# Editing and pause/resume must not skip today's still-unhandled occurrence.
- tapOn: "Edit recurring item Salary"
- tapOn: "Save recurring item"
- assertVisible: "Needs confirmation"
- tapOn: "Edit recurring item Salary"
- scrollUntilVisible:
    element:
      text: "Pause recurring item"
    direction: DOWN
- tapOn: "Pause recurring item"
- assertVisible: "Edit recurring item Salary, Paused"
- tapOn: "Edit recurring item Salary, Paused"
- scrollUntilVisible:
    element:
      text: "Resume recurring item"
    direction: DOWN
- tapOn: "Resume recurring item"
- assertVisible: "Needs confirmation"

- tapOn: "Keep this recurring item pending"
- assertVisible: "Needs confirmation"
- tapOn: "Mark as received"
- assertNotVisible: "Needs confirmation"
- tapOn: "Home"
- assertVisible: "Income"
- assertVisible: ".*3,000.*"
- tapOn: "Budget"
- assertVisible: "Income received"
- assertVisible: ".*3k.*"
- tapOn: "Home"

# Relaunch proves the received income persists instead of disappearing.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*3,000.*"
    timeout: 15000

# Removing one received occurrence must not make that date pending again.
- scrollUntilVisible:
    element:
      text: "Edit Salary"
    direction: DOWN
- tapOn: "Edit Salary"
- scrollUntilVisible:
    element:
      text: "Delete entry"
    direction: DOWN
- tapOn: "Delete entry"
- tapOn: "Yes, delete entry"
- tapOn: "Recurring"
- extendedWaitUntil:
    visible: "Monthly bills"
    timeout: 15000
- assertNotVisible: "Needs confirmation"

# Create, fund, correct, edit, complete, and delete a shared goal.
- tapOn: "Budget"
- extendedWaitUntil:
    visible: "Spending"
    timeout: 15000

# A populated category is itself an edit action and opens with its saved limit selected.
- tapOn: "Edit Food budget"
- assertVisible: "Monthly limit"
- tapOn: "Enter 1"
- tapOn:
    text: "Enter 0"
    repeat: 4
- tapOn: "Save"
- assertVisible: "Edit Food budget"
- tapOn: "Edit Food budget"
- assertVisible: "Monthly limit"
- assertVisible: ".*10,000.*"
- tapOn: "Cancel"

- tapOn: "Goals"
- tapOn: "Create a goal"
- tapOn:
    id: "goal-name"
- inputText: "Smoke goal"
- pressKey: Enter
- tapOn: "Enter 1"
- tapOn:
    text: "Enter 0"
    repeat: 4
- tapOn: "Save goal"
- tapOn: ".*Smoke goal.*"
- tapOn: "Add money.*"
- tapOn: "Enter 2"
- tapOn: "Enter 5"
- tapOn:
    text: "Enter 0"
    repeat: 2
- tapOn: "Save goal contribution"
- assertVisible: "25%"

# Relaunch proves the goal ledger survives and route state can be restored.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*Smoke goal.*"
    timeout: 15000
- runFlow:
    when:
      notVisible: "Edit goal.*"
    commands:
      - tapOn: ".*Smoke goal.*"
- tapOn: "Edit goal.*"
- tapOn:
    id: "goal-name"
- eraseText
- inputText: "Smoke goal updated"
- pressKey: Enter
- tapOn: "Save goal"
- assertVisible: ".*Smoke goal updated.*"

# Remove the mistaken contribution, then complete the target.
- tapOn: ".*tap to remove.*"
- tapOn: "Remove"
- assertVisible: "0%"
- tapOn: "Add money.*"
- tapOn: "Enter 1"
- tapOn:
    text: "Enter 0"
    repeat: 4
- tapOn: "Save goal contribution"
- assertVisible: "100%"
- tapOn: "Delete goal"
- tapOn: "Yes, delete goal"
- assertNotVisible: ".*Smoke goal updated.*"

# Cleanup keeps repeated local runs isolated.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Preferences"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Widgets.*"
    direction: DOWN
- tapOn: "Widgets.*"
- assertVisible: "Available widget"
- tapOn:
    id: "BackButton"
- scrollUntilVisible:
    element:
      text: "Spaces.*"
    direction: UP
- tapOn: "Spaces.*"
- assertVisible: "Create a space"
- assertVisible: "Join with a code"
- tapOn: "Close spaces"
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- tapOn: "Yes, delete account"
- extendedWaitUntil:
    visible: ".*(Know what you can spend|Welcome back).*"
    timeout: 15000
